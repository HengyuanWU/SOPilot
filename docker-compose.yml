services:
  neo4j:
    image: neo4j:5.21.0
    container_name: sopilot-neo4j
    environment:
      - NEO4J_AUTH=neo4j/test1234
      - NEO4J_server_config_strict__validation_enabled=false
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1

  qdrant:
    image: qdrant/qdrant:latest
    container_name: sopilot-qdrant
    environment:
      # —— 显式禁用可能遗留的代理变量 ——
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - http_proxy=
      - https_proxy=
      - NO_PROXY=
      - no_proxy=
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1

  backend:
    build: .
    container_name: sopilot-backend
    env_file:
      - backend/.env
    environment:
      - TZ=Asia/Shanghai
      - PYTHONPATH=/app/backend/src
      - APP_OUTPUT_DIR=/app/output
      - VALIDATOR_PASS_THRESHOLD=7.0
      - APP_USE_REAL_WORKFLOW=${APP_USE_REAL_WORKFLOW:-true}
      - APP_DEFAULT_PROVIDER=${APP_DEFAULT_PROVIDER:-}
      - APP_NEO4J_BOLT_URL=bolt://neo4j:test1234@neo4j:7687
      - APP_NEO4J__URI=bolt://neo4j:7687
      - APP_NEO4J__USER=neo4j
      - APP_NEO4J__PASSWORD=test1234
      - APP_NEO4J__DATABASE=neo4j
      - NEO4J_BOLT_URL=bolt://neo4j:test1234@neo4j:7687
      # —— Qdrant 配置 ——
      - APP_QDRANT__URL=http://qdrant:6333
      - APP_QDRANT__COLLECTION=kb_chunks
      - APP_QDRANT__DISTANCE=cosine
      # —— 使用国内 PyPI 镜像，减少构建/启动时的网络波动 ——
      # 主镜像：清华
      - PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple
      - PIP_TRUSTED_HOST=pypi.tuna.tsinghua.edu.cn
      # 备用镜像：官方 PyPI
      - PIP_EXTRA_INDEX_URL=https://pypi.org/simple
      # —— 显式禁用可能遗留的代理变量（采用镜像方案） ——
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - http_proxy=
      - https_proxy=
      - NO_PROXY=
      - no_proxy=
    ports:
      - "8000:8000"
    depends_on:
      - neo4j
      - qdrant
    command: >
      sh -c "
      pip install -r /app/backend/requirements.txt &&
      pip install https://github.com/explosion/spacy-models/releases/download/zh_core_web_sm-3.7.0/zh_core_web_sm-3.7.0-py3-none-any.whl &&
      pip install https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.7.1/en_core_web_sm-3.7.1-py3-none-any.whl &&
      python -m uvicorn app.asgi:app --host 0.0.0.0 --port 8000 --app-dir /app/backend/src --reload
      "
    volumes:
      # 仅挂载后端源码与依赖清单，避免覆盖 /app 下其他内容
      - ./backend/src:/app/backend/src
      - ./backend/requirements.txt:/app/backend/requirements.txt
      # 业务输出可单独挂载
      - ./output:/app/output
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1

  frontend:
    image: node:20-bookworm-slim
    container_name: sopilot-frontend
    working_dir: /app/frontend
    environment:
      # —— 显式禁用代理，强制使用镜像源 ——
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - http_proxy=
      - https_proxy=
      - NO_PROXY=
      - no_proxy=
      # —— npm 容错设置（也可放到项目根 .npmrc） ——
      - NPM_CONFIG_FETCH_RETRIES=5
      - NPM_CONFIG_FETCH_TIMEOUT=120000
      - NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT=300000
      - NPM_CONFIG_STRICT_SSL=true
    volumes:
      - ./frontend:/app/frontend
    # 先切换 registry 到 npmmirror，再执行安装与启动
    command: >
      sh -c "
      npm config set registry https://registry.npmmirror.com &&
      npm ci --no-audit --no-fund &&
      npm run dev -- --host
      "
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1

volumes:
  neo4j_data:
  neo4j_logs:
  qdrant_data:
